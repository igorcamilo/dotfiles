name: Generate flake lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flake-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate on aarch64-linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out selected revision
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Generate candidate lock
        shell: bash
        run: |
          set -euo pipefail
          nix flake lock
          test -s flake.lock
          sha256sum flake.lock > flake.lock.sha256
          git rev-parse HEAD > SOURCE_REVISION

      - name: Validate locked metadata
        shell: bash
        run: |
          set -euo pipefail
          nix flake metadata --no-update-lock-file
          sha256sum --check flake.lock.sha256

      - name: Require exactly four NixOS configurations
        shell: bash
        run: |
          set -euo pipefail
          expected='["igor-desktop","igor-desktop-bootstrap","igor-vm","igor-vm-bootstrap"]'
          actual=$(
            nix eval \
              --no-update-lock-file \
              --json \
              .#nixosConfigurations \
              --apply builtins.attrNames \
              | jq -c 'sort'
          )
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Expected ${expected}, got ${actual}."
            exit 1
          fi
          sha256sum --check flake.lock.sha256

      - name: Upload lock candidate
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock-${{ github.sha }}
          path: |
            flake.lock
            flake.lock.sha256
            SOURCE_REVISION
          if-no-files-found: error
          retention-days: 7

      - name: Run ARM flake checks
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --no-update-lock-file --print-build-logs
          sha256sum --check flake.lock.sha256

      - name: Build both ARM host profiles explicitly
        shell: bash
        run: |
          set -euo pipefail
          nix build \
            --no-link \
            --no-update-lock-file \
            .#nixosConfigurations.igor-vm.config.system.build.toplevel \
            .#nixosConfigurations.igor-vm-bootstrap.config.system.build.toplevel
          sha256sum --check flake.lock.sha256
