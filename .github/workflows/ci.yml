name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-system:
    name: Validate igor-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Require committed flake lock
        shell: bash
        run: |
          if [[ ! -s flake.lock ]] \
            || ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "::error file=flake.lock::flake.lock must be generated and committed from a NixOS environment whenever flake inputs change."
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Validate and build native host
        run: scripts/check-system.sh igor-desktop x86_64-linux

      - name: Confirm the checkout stayed clean
        if: always()
        shell: bash
        run: |
          if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
            git status --short
            exit 1
          fi

  repository-quality:
    name: Repository quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Require committed flake lock
        shell: bash
        run: |
          if [[ ! -s flake.lock ]] \
            || ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "::error file=flake.lock::flake.lock must be generated and committed from a NixOS environment whenever flake inputs change."
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Check repository files
        run: scripts/check-repository.sh

      - name: Confirm the checkout stayed clean
        if: always()
        shell: bash
        run: |
          if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
            git status --short
            exit 1
          fi

  history-secrets:
    name: Git history secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Require committed flake lock
        shell: bash
        run: |
          if [[ ! -s flake.lock ]] \
            || ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "::error file=flake.lock::flake.lock must be generated and committed from a NixOS environment whenever flake inputs change."
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Scan Git history for secrets
        run: |
          nix shell \
            --no-update-lock-file \
            --inputs-from . \
            nixpkgs#gitleaks \
            --command gitleaks detect --source . --redact --verbose

      - name: Confirm the checkout stayed clean
        if: always()
        shell: bash
        run: |
          if [[ -n $(git status --porcelain --untracked-files=all) ]]; then
            git status --short
            exit 1
          fi
