name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-systems:
    name: Validate ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require committed flake lock
        shell: bash
        run: |
          if [[ ! -s flake.lock ]] \
            || ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "::error file=flake.lock::flake.lock must be generated and committed from a NixOS environment whenever flake inputs change."
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Validate locked flake and build native host profiles
        run: nix flake check --no-update-lock-file --keep-going --print-build-logs

      - name: Confirm the lock file was not changed
        if: always()
        run: git diff --exit-code -- flake.lock

  history-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require committed flake lock
        shell: bash
        run: |
          if [[ ! -s flake.lock ]] \
            || ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "::error file=flake.lock::flake.lock must be generated and committed from a NixOS environment whenever flake inputs change."
            exit 1
          fi

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Scan Git history for secrets
        run: nix develop --no-update-lock-file --command gitleaks detect --source . --redact --verbose

      - name: Confirm the lock file was not changed
        if: always()
        run: git diff --exit-code -- flake.lock
