name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main

      # hardware-configuration.nix is machine-specific and gitignored
      # (see README's "Layout"/"Secrets" sections); this stub exists
      # purely so the flake evaluates here, not to be deployed anywhere.
      - name: Stub hardware-configuration.nix
        run: |
          cat > hardware-configuration.nix <<'EOF'
          { modulesPath, ... }:
          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];
            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };
          }
          EOF

      - run: nix flake check

      - name: Dry-run the full system closure
        run: nix build .#nixosConfigurations.igor-desktop.config.system.build.toplevel --dry-run

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command gitleaks detect --source . --no-git -v

  qmllint:
    runs-on: ubuntu-latest
    # Resolving Quickshell's own QML modules in a headless nix shell is
    # somewhat fragile; treat this job as advisory, not a hard gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Lint QML files
        run: |
          nix shell nixpkgs#qt6.qtdeclarative nixpkgs#quickshell --command bash -c '
            export QML2_IMPORT_PATH="$(nix eval --raw nixpkgs#quickshell)/lib/qt-6/qml"
            find dotfiles/quickshell -name "*.qml" -print0 | xargs -0 -n1 qmllint
          '
