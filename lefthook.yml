pre-commit:
  commands:
    secrets:
      run: gitleaks protect --staged --redact
    # hosts/*/hardware-configuration.nix is nixos-generate-config's own
    # output (its header says not to hand-edit it), so both checks below
    # skip it, same as scripts/check.sh does for CI. lefthook's own YAML
    # fields aren't shell-evaluated, so this one line can't read
    # scripts/generated-nix-files.glob like the statix command below does;
    # keep it in sync with that file by hand.
    nixfmt:
      glob: "*.nix"
      exclude:
        - "hosts/*/hardware-configuration.nix"
      run: nixfmt {staged_files}
      stage_fixed: true
    # Same invocation scripts/check.sh uses in CI: statix doesn't offer a
    # reliable fix for every lint (e.g. repeated-key warnings are report-only),
    # so this checks rather than auto-fixes, same as CI does.
    statix:
      glob: "*.nix"
      run: statix check -i "$(cat scripts/generated-nix-files.glob)" .
